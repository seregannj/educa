  .vemoji{width:34px;height:34px;border:none;background:transparent;font-size:20px;cursor:pointer;transition:.15s}
  .vemoji:hover{transform:scale(1.25)}
  .bubble{position:absolute;bottom:70px;font-size:26px;pointer-events:none;animation:rise 1.2s ease-out forwards}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(-170px) scale(1.35);opacity:0}}

  ["МФ","МФТИ","#FFE9E7","#D23B2E"],["ВШ","ВШЭ","#FFF4E0","#C77700"],
  ["БМ","Бауманка","#EAF1FF","#2E5B9F"],["МИ","МИФИ","#EDEBFF","#5A4FC4"],
  ["МР","МИРЭА","#E8F6EC","#1F8A4C"],["МА","МАИ","#FDEEF2","#C2426E"]
];

const STORYDATA = {
  "МФТИ":[["День открытых дверей ФПМИ","15 ноября, 14:00 · главный корпус. Регистрация открыта"],["Личный кабинет абитуриента","подай документы онлайн и следи за статусом"]],
  "ВШЭ":[["Открыт набор: ИИ и анализ данных","120 мест · проходной прошлого года — 305"],["Дни открытых дверей ФКН","онлайн и офлайн-форматы в декабре"]],
  "Бауманка":[["Экскурсии по лабораториям ИУ","запись открыта для 11-классников"],["Олимпиада «Шаг в будущее»","диплом = льгота при поступлении"]],
  "МИФИ":[["Профилактикум для абитуриентов","бесплатные консультации по математике и физике"]],
  "МИРЭА":[["День открытых дверей ИИТ","знакомство с кафедрами и лабораториями"]],
  "МАИ":[["Аэрокосмический день","экскурсия в музей и на производства"]]
};

const feedEl = document.getElementById("feed");
const chcolor = {"Высокий шанс":"var(--good)","Средний шанс":"var(--warn)","Низкий шанс":"var(--bad)"};
let activeTab = "subs";

function render(){
  feedEl.innerHTML = "";
  if(activeTab==="useful"){
    const d = document.createElement("div"); d.className="daily";
    d.innerHTML = `<div class="dicon">${ICON.bolt}</div>
      <div><div class="dt">Задача дня</div><div class="ds" id="ds">5 минут — и стрик твой</div></div>
      <div class="dstreak" id="streak">${ICON.flame}<span>12</span></div>`;
    d.addEventListener("click",()=>{
      streak++; document.querySelector("#streak span").textContent=streak;
      document.getElementById("ds").innerHTML='<span style="color:var(--good);font-weight:700">Готово! Завтра снова</span>';
    });
    feedEl.appendChild(d);
  }
  let list;
  if(activeTab==="subs") list = posts.filter(p=>p.sub);
  else if(activeTab==="useful") list = posts.filter(p=>p.cat==="useful"||p.cat==="uni");
  else list = posts.filter(p=>p.cat==="common"||p.cat==="memes");
  list.forEach(p=>{
    const [mono,bg,fg] = AV[p.name] || [p.name.slice(0,2).toUpperCase(),"#EEE","#555"];
    const el = document.createElement("div"); el.className="post";
    el.innerHTML = `
      <div class="pleft">
        <div class="ava" style="--abg:${bg};--afg:${fg}">${mono}</div>
        ${p.sub===false?`<button class="subava">${ICON.plus}</button>`:""}
      </div>
      <div class="pbody">
        <div class="prow">
          <span class="pname">${p.name}</span>
          ${p.v?ICON.vbadge:""}
          <span class="dot-sep">·</span><span class="ptime">${p.time}</span>
        </div>
        <div class="ptext">${p.text}</div>
        ${p.chances?`<div class="attach"><div class="attach-head">Профиль абитуриента · 287 · М+И+А</div>
          ${p.chances.map(([n,dd,c])=>`<div class="chance-row">
            <span class="cdot" style="background:${chcolor[c]}"></span>
            <div><div class="cname">${n}</div><div class="cprog">${dd}</div></div>
            <span class="cchance" style="color:${chcolor[c]}">${c}</span>
          </div>`).join("")}</div>`:""}
        ${p.chip?`<div class="attach attach-row"><svg class="ticon2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11M15 9v11"/></svg><span>${p.chip}</span>${ICON.chev}</div>`:""}
        ${p.meme?`<div class="attach"><div class="attach-head">Мем</div><div class="attach-text">${p.meme}</div></div>`:""}
        <div class="pacts">
          <span class="act like">${ICON.heart}<span>${p.likes}</span></span>
          <span class="act">${ICON.reply}<span>${p.replies}</span></span>
          <span class="act">${ICON.repost}<span>${p.reposts}</span></span>
          <span class="act">${ICON.share}</span>
        </div>
      </div>
      <button class="pmore">${ICON.dots}</button>
      <div class="pmenu">
        <button>${ICON.bookmark}В избранное</button>
        <button>${ICON.link}Скопировать ссылку</button>
        <button>${ICON.flag}Пожаловаться</button>
      </div>`;
    el.querySelector(".like").addEventListener("click",e=>{
      const s=e.currentTarget,n=s.querySelector("span");
      const on=s.classList.toggle("liked"); n.textContent=+n.textContent+(on?1:-1);
    });
    const sbtn=el.querySelector(".subava");
    if(sbtn) sbtn.addEventListener("click",()=>{
      sbtn.innerHTML=ICON.checkP.replace('stroke-width','stroke="var(--blue)" stroke-width');
      setTimeout(()=>sbtn.remove(),650);
    });
    feedEl.appendChild(el);
  });
  const end=document.createElement("div"); end.className="theend";
  end.innerHTML=`
    <svg class="endsvg" viewBox="0 0 140 100">
      <circle cx="56" cy="40" r="26" fill="none" stroke="var(--blue)" stroke-width="4.5"/>
      <path d="M75 59 98 82" stroke="var(--blue)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="49" cy="36" r="2.6" fill="var(--blue)"/>
      <circle cx="64" cy="36" r="2.6" fill="var(--blue)"/>
      <path d="M50 46c4 3.5 9 3.5 13 0" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round"/>
      <path d="M88 18l2.2 5 5 2.2-5 2.2-2.2 5-2.2-5-5-2.2 5-2.2z" fill="#FFB020"/>
      <circle cx="110" cy="50" r="3" fill="var(--good)"/>
      <circle cx="24" cy="66" r="2.4" fill="var(--bad)"/>
    </svg>
    <div class="t1">Это конец ленты… пока что</div>
    <div class="t2">Новое появится — заглядывай позже 👋</div>`;
  feedEl.appendChild(end);
}

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".seg"); if(!b) return;
  document.querySelectorAll(".seg").forEach(t=>t.classList.remove("active"));
  b.classList.add("active"); activeTab=b.dataset.tab; render();
});

let streak = 12;

const moreBtn=document.getElementById("morebtn"), moreMenu=document.getElementById("moremenu");
moreBtn.addEventListener("click",e=>{ e.stopPropagation(); moreMenu.classList.toggle("on"); });
document.addEventListener("click",e=>{
  if(moreMenu.classList.contains("on") && !moreMenu.contains(e.target) && !moreBtn.contains(e.target)){
    e.stopPropagation(); e.preventDefault(); moreMenu.classList.remove("on");
  }
},true);
moreMenu.querySelectorAll("button").forEach(b=>{ if(b.id!=="mi-theme") b.addEventListener("click",()=>moreMenu.classList.remove("on")); });
const themeItem=document.getElementById("mi-theme");
themeItem.addEventListener("click",e=>{
  const x=e.clientX||innerWidth-60, y=e.clientY||40;
  const dark=document.documentElement.dataset.theme==="dark";
  const apply=()=>{
    document.documentElement.classList.add("noanim");
    document.documentElement.dataset.theme=dark?"light":"dark";
    document.getElementById("themeicon").innerHTML=dark?ICON.moonP:ICON.sunP;
    document.getElementById("themelabel").textContent=dark?"Тёмная тема":"Светлая тема";
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove("noanim")));
  };
  if(document.startViewTransition){
    const vt=document.startViewTransition(apply);
    vt.ready.then(()=>{
      const r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
      document.documentElement.animate(
        {clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},
        {duration:550,easing:"ease-in-out",pseudoElement:"::view-transition-new(root)"}
      );
    });
  } else apply();
});

document.getElementById("stories").innerHTML =
  `<div class="story"><div class="ownring"><svg viewBox="0 0 24 24" width="20" height="20" style="stroke:var(--muted);fill:none;stroke-width:2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="splus">+</span></div><span class="sname">Моя история</span></div>` +
  stories.map(([m,n,bg,fg],i)=>`<div class="story" data-i="${i}"><div class="sring"><div class="sava" style="--abg:${bg};--afg:${fg}">${m}</div></div><span class="sname">${n}</span></div>`).join("");

const hstrip=document.getElementById("hstrip"), storiesEl=document.getElementById("stories");
hstrip.innerHTML = stories.slice(0,3).map(([m,n,bg,fg],i)=>`<span class="sc" data-i="${i}" style="left:${i*18}px;z-index:${30-i}"><span class="sin" style="--abg:${bg};--afg:${fg}">${m}</span></span>`).join("");
const phoneEl=document.querySelector(".phone"), headerEl=document.querySelector("header");
phoneEl.addEventListener("scroll",()=>{
  const hideAt = storiesEl.offsetTop + storiesEl.offsetHeight - headerEl.offsetHeight;
  hstrip.classList.toggle("on", phoneEl.scrollTop >= hideAt - 2);
});

document.querySelectorAll("#stories .story[data-i]").forEach(el=>el.addEventListener("click",()=>{
  if(phoneEl.scrollTop > 24){ phoneEl.scrollTo({top:0,behavior:"smooth"}); return; }
  openStory(+el.dataset.i,el);
}));
document.querySelectorAll("#hstrip .sc").forEach(el=>el.addEventListener("click",()=>phoneEl.scrollTo({top:0,behavior:"smooth"})));
document.querySelector(".wordmark").addEventListener("click",()=>phoneEl.scrollTo({top:0,behavior:"smooth"}));

const viewer=document.createElement("div");
viewer.className="viewer";
viewer.innerHTML=`
  <div class="vbars"></div>
  <div class="vslide"><div class="vtag"></div><div class="vt"></div><div class="vs"></div></div>
  <div class="vbrand"><span class="mini"></span><span class="vname"></span></div>
  <button class="vclose">✕</button>
  <div class="vbottom">
    <button class="vreact" title="Реакция"><svg viewBox="0 0 24 24"><path d="M12 21C7 16.5 3 13.3 3 9.2 3 6.4 5.2 4 8 4c1.6 0 3.1.8 4 2 .9-1.2 2.4-2 4-2 2.8 0 5 2.4 5 5.2 0 4.1-4 7.3-9 11.8z"/></svg></button>
    <div class="vfield">Отправить сообщение…</div>
    <button class="vemoji" data-e="🔥">🔥</button>
    <button class="vemoji" data-e="😂">😂</button>
    <button class="vemoji" data-e="😍">😍</button>
  </div>
  <div class="vtap l"></div><div class="vtap r"></div>`;
document.body.appendChild(viewer);
let curStory=0, curSlide=0, vSlides=null;
const reacted={};
const SLIDE_DUR=4300;
let slideStart=0, slideElapsed=0, paused=false, rafId=null;

function barsRebuild(){
  viewer.querySelector(".vbars").innerHTML=vSlides.map(()=>`<div class="vbar"><i></i></div>`).join("");
}
function syncHeart(){
  viewer.querySelector(".vreact").classList.toggle("on",!!reacted[curStory]);
}
function markSeen(i){
  const row=document.querySelector(`#stories .story[data-i="${i}"]`);
  if(row) row.classList.add("seen");
  const st=document.querySelector(`#hstrip .sc[data-i="${i}"]`);
  if(st) st.classList.add("seen");
}
function drawBar(){
  const bar=viewer.querySelectorAll(".vbar")[curSlide];
  if(bar) bar.querySelector("i").style.width=Math.min(100,slideElapsed/SLIDE_DUR*100)+"%";
}
function tick(){
  if(paused) return;
  slideElapsed=Math.min(SLIDE_DUR,Date.now()-slideStart);
  drawBar();
  if(slideElapsed>=SLIDE_DUR){ nextSlide(); return; }
  rafId=requestAnimationFrame(tick);
}
function playSlide(){ slideStart=Date.now()-slideElapsed; paused=false; cancelAnimationFrame(rafId); rafId=requestAnimationFrame(tick); }
function pauseSlide(){ paused=true; cancelAnimationFrame(rafId); }
function showSlide(i){
  curSlide=i;
  const bars=viewer.querySelectorAll(".vbar");
  bars.forEach((b,bi)=>{ b.classList.remove("run","done"); b.querySelector("i").style.width=(bi<i?100:0)+"%"; });
  const [t,s]=vSlides[i];
  viewer.querySelector(".vt").textContent=t;
  viewer.querySelector(".vs").textContent=s;
  slideElapsed=0; paused=false; playSlide();
}
function goStory(i,slide){
  curStory=i;
  const [m,n,bg,fg]=stories[i];
  vSlides=STORYDATA[n]||[[n,"Новости появятся совсем скоро"]];
  const mini=viewer.querySelector(".vbrand .mini");
  mini.textContent=m; mini.style.background=bg; mini.style.color=fg;
  viewer.querySelector(".vbrand .vname").textContent=n;
  viewer.querySelector(".vslide").style.background=`linear-gradient(160deg,${fg},${bg})`;
  barsRebuild();
  syncHeart();
  showSlide(slide||0);
}
function nextSlide(){
  markSeen(curStory);
  if(curSlide+1<vSlides.length){ showSlide(curSlide+1); return; }
  if(curStory+1<stories.length){ goStory(curStory+1,0); return; }
  closeViewer();
}
function prevSlide(){
  if(curSlide>0){ showSlide(curSlide-1); return; }
  if(curStory>0){
    const [m,n]=stories[curStory-1];
    const ps=STORYDATA[n]||[[n,"..."]];
    goStory(curStory-1,ps.length-1);
  }
}
function openStory(i,storyEl){
  for(let j=0;j<i;j++) markSeen(j);
  goStory(i,0);
  viewer.classList.add("on");
}
function closeViewer(){
  paused=true; cancelAnimationFrame(rafId);
  markSeen(curStory);
  viewer.classList.remove("on");
}
viewer.querySelector(".vclose").addEventListener("click",closeViewer);
viewer.querySelector(".vtap.r").addEventListener("click",nextSlide);
viewer.querySelector(".vtap.l").addEventListener("click",prevSlide);
viewer.querySelector(".vreact").addEventListener("click",e=>{
  e.stopPropagation();
  reacted[curStory]=!reacted[curStory];
  syncHeart();
  if(reacted[curStory]) spawnBubble("❤️");
});
viewer.querySelectorAll(".vemoji").forEach(b=>b.addEventListener("click",e=>{
  e.stopPropagation();
  reacted[curStory]=true; syncHeart();
  spawnBubble(b.dataset.e);
}));
function spawnBubble(sym){
  const s=document.createElement("span");
  s.className="bubble"; s.textContent=sym;
  s.style.right=(30+Math.random()*50)+"px";
  viewer.appendChild(s);
  setTimeout(()=>s.remove(),1250);
}

document.addEventListener("click",e=>{
  const btn=e.target.closest(".pmore");
  if(btn){
    e.stopPropagation();
    const menu=btn.closest(".post").querySelector(".pmenu");
    document.querySelectorAll(".pmenu.on").forEach(m=>{ if(m!==menu) m.classList.remove("on"); });
    menu.classList.toggle("on");
    return;
  }
  if(e.target.closest(".pmenu")){ e.target.closest(".pmenu").classList.remove("on"); return; }
  document.querySelectorAll(".pmenu.on").forEach(m=>m.classList.remove("on"));
});

const ptrEl=document.getElementById("ptr");

render();
</script>
</body>
</html>
